[package]
name = "lance-datafusion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lance DataFusion integration (Iceberg-style modular layout)"

[features]
default = []
rest = []

[dependencies]
async-trait = "0.1"
dashmap = "6"
futures = "0.3"

# DataFusion and related crates (must match Lance's pinned version)
datafusion = { version = "50.3.0" }

# Lance core crates from git (tagged to v2.0.0-beta.4)
lance = { git = "https://github.com/lance-format/lance", package = "lance", tag = "v2.0.0-beta.4", default-features = false, features = ["protoc"] }
lance-namespace = { git = "https://github.com/lance-format/lance", package = "lance-namespace", tag = "v2.0.0-beta.4" }
lance-namespace-impls = { git = "https://github.com/lance-format/lance", package = "lance-namespace-impls", tag = "v2.0.0-beta.4" }

# Async runtime
tokio = { version = "1.23", features = ["macros", "rt-multi-thread"] }

# Arrow for RecordBatchIterator in DML / tests
arrow = "56.1"
arrow-array = "56.1"
arrow-schema = "56.1"
datafusion-sql = "50.3.0"
datafusion-session = "50.3.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1.0"
datafusion-cli = "50"

[dev-dependencies]
# Test helpers
lance-datagen = { git = "https://github.com/lance-format/lance", package = "lance-datagen", tag = "v2.0.0-beta.4" }
tempfile = "3"
bytes = "1"

[package]
name = "lance-datafusion-catalog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DataFusion CatalogProvider integration for Lance using lance-namespace."
readme = "README.md"

[dependencies]
async-trait = "0.1"
dashmap = "6"

# DataFusion and related crates (must match Lance's pinned version)
datafusion = "50.0.0"
datafusion-common = "50.0.0"
datafusion-sql = "50.0.0"
datafusion-catalog = "50.0.0"
datafusion-session = "50.0.0"

# Lance core crates from git (tagged to v2.0.0-beta.4)
lance = { git = "https://github.com/lance-format/lance", package = "lance", tag = "v2.0.0-beta.4", default-features = false }
lance-namespace = { git = "https://github.com/lance-format/lance", package = "lance-namespace", tag = "v2.0.0-beta.4" }
lance-namespace-impls = { git = "https://github.com/lance-format/lance", package = "lance-namespace-impls", tag = "v2.0.0-beta.4" }

# Async runtime
tokio = { version = "1.23", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# Test helpers
arrow = "56.1"
arrow-array = "56.1"
arrow-schema = "56.1"

lance-datagen = { git = "https://github.com/lance-format/lance", package = "lance-datagen", tag = "v2.0.0-beta.4" }
tempfile = "3"
